<div class="demo-banner" role="note">DEMONSTRATION · SAMPLE DATA · BUILT BY EXPERIUS FOR BHUIYAN ACADEMY</div>
<a class="skip-link" href="#main">Skip to content</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Staff navigation">
    <div class="sidebar__brand">
      <img class="sidebar__crest" src="/assets/brand/crest.png" width="40" height="40" alt="Bhuiyan Academy crest">
      <div>
        <p class="sidebar__name">Bhuiyan Academy</p>
        <p class="eyebrow" data-role-label>Staff portal</p>
      </div>
    </div>
    <nav class="sidebar__nav" aria-label="Staff" data-office-nav>
      <a class="sidebar__link" href="/portal/admin-dashboard" data-nav="admin-dashboard" data-page="admin-dashboard">Today</a>
      <a class="sidebar__link" href="/portal/admin-inquiries" data-nav="admin-inquiries" data-page="admin-inquiries">Inquiries</a>
      <a class="sidebar__link" href="/portal/admin-fees" data-nav="admin-fees" data-page="admin-fees">Fees &amp; receipts</a>
      <a class="sidebar__link" href="/portal/admin-attendance" data-nav="admin-attendance" data-page="admin-attendance">Attendance</a>
      <a class="sidebar__link" href="/portal/admin-students" data-nav="admin-students" data-page="admin-students">Students</a>
      <a class="sidebar__link" href="/portal/admin-notices" data-nav="admin-notices" data-page="admin-notices">Post a notice</a>
    </nav>
    <div class="sidebar__user">
      <p class="sidebar__student"><span data-staff-name>Staff</span><br><span class="sidebar__id">Demo staff</span></p>
      <a class="sidebar__signout" href="/portal/" data-signout>Sign out</a>
    </div>
  </aside>
  <div class="shell__scrim" data-drawer-close></div>

  <div class="shell__main">
    <header class="topbar">
      <button class="topbar__menu" type="button" aria-expanded="false" aria-controls="sidebar" data-drawer-toggle>Menu</button>
      <h1 class="topbar__title" data-topbar-title>{{portal_title}}</h1>
      <div class="topbar__actions">
        <a class="btn btn--text" href="/">Back to website</a>
      </div>
    </header>
    <main class="shell__content" id="main">
{{content}}
    </main>
  </div>
</div>
<script>
(function () {
  var sidebar = document.getElementById('sidebar');
  var btn = document.querySelector('[data-drawer-toggle]');
  if (!sidebar || !btn) return;
  function set(open) {
    sidebar.classList.toggle('is-open', open);
    document.body.classList.toggle('drawer-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  btn.addEventListener('click', function () { set(!sidebar.classList.contains('is-open')); });
  document.querySelector('[data-drawer-close]').addEventListener('click', function () { set(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { set(false); } });
  window.matchMedia('(min-width: 900px)').addEventListener('change', function (e) { if (e.matches) set(false); });
})();
</script>
